<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello World!</h1>
    <a href="#">Click me</a>
    <!-- 
    Document Object Model(DOM): This is a way that we can use JavaScript to access html elements, make changes, delete
    create them
    DOM API has methods and properties.
    DOM API methods are used to carry out actions on the html elements
    DOM API properties are used to access features
    SOme DOM API Methods are:
    1. document.getElementById()
    2. document.getElementsByTagName()
    3. document.getElementsByClassName()
    4. document.querySelector()
    5. document.querySelectorAll()

    As a way of intrucing html; HTML means Hyper Text Markup Language.
    HTML tree is a way of structuring html like a family
    Now, <html> is the father
    He has two sons; <head>, and <body>
    <head> has 5 children; <title>, <style>, <script>, <link>, <meta>
    <body> has many children e.g <h1> to <h6>, <p>, <div>, <i>,<b>,<span>,<img>
    How do we differentiate a child from a parent in html
    A child is enclosed in an angular bracket by a parent
    -->
</body>
</html>
