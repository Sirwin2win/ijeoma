<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grad1{
            height: 300px;
            width: 300px;
            background-image: linear-gradient(to bottom left,red,green,blue);
        }
        #grad2{
            height: 300px;
            width: 300px;
            background-image: repeating-linear-gradient(red,yellow 10%,green 15%);
        }
        #grad3{
            height: 300px;
            width: 300px;
            background-image: radial-gradient(red,yellow,green);
        }
        #grad4{
            height: 300px;
            width: 300px;
            border-radius: 50%;
            background-image: repeating-radial-gradient(red,yellow 10%,green 15%);
        }
        #grad5{
            height: 300px;
            width: 300px;
            border-radius: 50%;
            background-image: conic-gradient(red,yellow,green);
        }
        #grad6{
            height: 300px;
            width: 300px;
            border-radius: 50%;
            background-image: repeating-conic-gradient(red,yellow 10%,green 15%);
        }
    </style>
</head>
<body>
    <!-- CSS Gradient
Gradient is used to specify more than one background color in an element
Type of Gradient
1. Linear gradient
2. Radial gradient
3. Conic gradient 
    -->
<h1 id="grad1"></h1>
<h1 id="grad2"> Repeat</h1>
<h1 id="grad3"> Radial</h1>
<h1 id="grad4"> Radial repeating</h1>
<h1 id="grad5"> Conic</h1>
<h1 id="grad6"> Conic</h1>
</body>
</html>
