<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #bco{
            height: 200px;
            width: 200px;
            border-style: ridge;
            border-color: red;
            border-width: 50px;
            border-radius: 20px;
            padding-top: 100px;
            padding-left: 100px;

        }
        #bco2{
            height: 200px;
            width: 200px;
            border-top-style: ridge;
            border-right-style: dotted;
            border-bottom-style: dashed;
            border-left-style: double;
            border-top-color: red;
            border-right-color: green;
            border-bottom-color: blue;
            border-left-color: fuchsia;
            border-width: 50px;
            border-radius: 50%;
            margin-top: 100px;
            margin-left: 100px;
            margin-bottom: 100px;
            padding-top: 100px;
            padding-left: 100px;
        }
    </style>
</head>
<body>
    <!-- border means boundary i.e a line round about an element -->
    <p id="bco">Border Color</p>
    <p id="bco2">Border Multi-style</p>
    <!-- margin is the space outside of the border -->
    <!-- padding is the space inside of the border or between the text and the border -->
</body>
</html>
