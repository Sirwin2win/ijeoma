<body>
    <!-- HTML List Types
1. unordered list
2. ordered list
3. description list 
    -->
<ul style="list-style-type: square;">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact Us</a></li>
</ul>

<ol start="50">
    <li>Rice</li>
    <li>Beans</li>
    <li>Garri</li>
    <li>Yam</li>
</ol>

<dl>
    <dt>HTML</dt>
    <dd>Hyper Text Markup Language</dd>
    <dt>Noun</dt>
    <dd>A name of person animal place or thing</dd>
</dl>


</body>
